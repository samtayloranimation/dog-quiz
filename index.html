
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Which dog are you?</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 520px; width: 100%; padding: 28px; border: 1px solid #ddd; border-radius: 16px; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    button { padding: 12px 16px; font-size: 16px; border-radius: 12px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .answer { margin-top: 18px; font-size: 22px; font-weight: 650; }
    .muted { margin-top: 8px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Which dog are you?</h1>
      <button id="btn" type="button">Tell me</button>

      <div id="answer" class="answer" aria-live="polite"></div>
      <div class="muted">This quiz is scientifically accurate.</div>
    </div>
  </div>

<script>
  const SPANIELS = [
    "King Charles Spaniel",
    "Cocker Spaniel",
    "English Springer Spaniel",
    "Welsh Springer Spaniel",
    "Clumber Spaniel",
    "Field Spaniel"
  ];

  const btn = document.getElementById("btn");
  const answerEl = document.getElementById("answer");

  function pickSpaniel() {
    const i = Math.floor(Math.random() * SPANIELS.length);
    return SPANIELS[i];
  }

  btn.addEventListener("click", () => {
    answerEl.textContent = "Analysing personality…";

    btn.disabled = true;

    setTimeout(() => {
      answerEl.textContent = pickSpaniel();
      btn.disabled = false;
    }, 1500);
  });
</script>
</body>
</html>
